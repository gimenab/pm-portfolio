<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" color="#1583a8" font-family="IBM Plex Mono, monospace" viewBox="0 0 1080 600"  role="img" aria-label="Core loop flowchart after the workflow session. Open the app. Decision: first visit? Yes shows a welcome to pick tasks and how they repeat; both paths go to the home, with today's tasks on top and the feed of moments below. Optionally write a difficult task, do the task outside the app, mark it done and add its minutes. Decision: all of today's tasks done? Yes adds the day bonus; both paths go to Your treasure. Decision: earned time or wildcard? Earned subtracts the minutes, down to 0; wildcard gives 15 minutes. Both start a timer that can be paused. Enjoy it outside the app. Decision: register the moment? Yes adds the time to minutes lived and the note to the personal feed of moments. Both answers go back to the home."><defs><marker id="uf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs><rect x="0" y="40" width="110" height="44" rx="22" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3" fill="#ffffff"/><text x="55.0" y="66.0" text-anchor="middle" font-size="13" fill="#333">Open the app</text><polygon points="220,18 290,62 220,106 150,62" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3" fill="#ffffff"/><text x="220" y="58" text-anchor="middle" font-size="12" fill="#333">First</text><text x="220" y="74" text-anchor="middle" font-size="11" fill="#666">visit?</text><polygon points="342,40 470,40 458,84 330,84" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3" fill="#ffffff"/><text x="400.0" y="58.0" text-anchor="middle" font-size="13" fill="#333">Home: tasks</text><text x="400.0" y="74.0" text-anchor="middle" font-size="12" fill="#666">+ feed below</text><polygon points="517,40 645,40 633,84 505,84" stroke="currentColor" stroke-opacity="0.6" strok